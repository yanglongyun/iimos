<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); -webkit-font-smoothing: antialiased; }
.stage { position: fixed; inset: 0; cursor: grab; touch-action: none; overflow: hidden; }
.stage.drag { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world.anim { transition: transform .32s cubic-bezier(.2,.7,.2,1); }
.world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.node { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; user-select: none; line-height: 1.4; }
.node.has { cursor: pointer; }
.node.rev { flex-direction: row-reverse; }
.node .t { display: block; }
.node .t i { display: block; font-style: normal; }
.node.born { animation: born .38s ease both; }
@keyframes born { from { opacity: 0; } }
.tog { flex: none; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.hud { position: fixed; left: 16px; right: 16px; top: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; pointer-events: none; z-index: 3; }
.hud > * { pointer-events: auto; }
.hud-t { display: flex; align-items: baseline; gap: 10px; }
.hud-t b { font-size: 15px; font-weight: 700; }
.hud-t span { font-size: 12px; color: var(--muted); }
.hud-n { margin-left: auto; display: flex; gap: 2px; background: var(--hud); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.hud-n a { text-decoration: none; color: var(--muted); font-size: 12.5px; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.hud-n a:hover { color: var(--ink); }
.hud-n a.on { background: var(--ink); color: var(--bg); }
.ctl { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 6px; z-index: 3; }
.ctl button { border: 1px solid var(--line); background: var(--hud); color: var(--ink); border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
.ctl button:hover { border-color: var(--muted); }
.tip { position: fixed; left: 16px; bottom: 18px; font-size: 12px; color: var(--muted); z-index: 3; pointer-events: none; }
:focus-visible { outline: 2px solid var(--c, var(--ink)); outline-offset: 3px; }
@media (max-width: 760px) { .tip { display: none; } .hud-n { margin-left: 0; max-width: 100%; overflow-x: auto; } }
@media (prefers-reduced-motion: reduce) { .node.born { animation: none; } .world.anim { transition: none; } }

:root { --bg: #060914; --ink: #E7ECF7; --muted: #8590AB; --line: rgba(255,255,255,.12); --hud: rgba(12,16,32,.85); color-scheme: dark;
  --f: "Sora", "PingFang SC", "Noto Sans SC", sans-serif; }
body { background: radial-gradient(ellipse at 50% 50%, #121A3A 0%, #070A17 55%, #04060E 100%); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 72% 12%, #cfd8ff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 38% 82%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 88% 64%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 22% 58%, #b9c6ff 50%, transparent 51%), radial-gradient(1px 1px at 58% 38%, #fff 50%, transparent 51%), radial-gradient(1.4px 1.4px at 94% 90%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 6% 92%, #fff 50%, transparent 51%); }
.hud-n a.on { background: #E7ECF7; color: #060914; }
.d0 { width: 156px; height: 156px; border-radius: 50%; flex-direction: column; justify-content: center; text-align: center; white-space: normal; gap: 6px;
  background: radial-gradient(circle at 32% 28%, #3A4A8C 0%, #18204A 55%, #0B1030 100%); border: 1px solid rgba(160,180,255,.35);
  box-shadow: 0 0 0 10px rgba(120,140,255,.06), 0 0 70px rgba(110,130,255,.45); color: #fff; font-size: 17px; font-weight: 700; padding: 18px; }
.d0 .t i { font-size: 10.5px; font-weight: 400; color: #AAB6E8; margin-top: 4px; }
.d0 .tog { border-color: rgba(255,255,255,.5); color: #fff; }
.d1 { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--c); border: 1px solid var(--c);
  background: color-mix(in srgb, var(--c) 14%, #0A0E1E); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 40%, transparent); text-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); }
.d1 .t i { display: none; }
.d2 { font-size: 13.5px; font-weight: 600; color: #EEF2FB; padding: 2px 4px; text-shadow: 0 0 10px rgba(0,0,0,.8); }
.d3 { font-size: 12.5px; font-weight: 600; color: var(--c); padding: 1px 4px; }
.d4 { font-size: 12px; color: #A9B3CB; white-space: normal; max-width: 230px; padding: 1px 4px; line-height: 1.5; }
.tog { min-width: 17px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 9.5px; font-weight: 600; border: 1px solid var(--c); color: var(--c); }
.open > .tog { background: var(--c); color: #060914; }
.node.sel { filter: drop-shadow(0 0 8px var(--c)); }
.ctl button { background: var(--hud); }
</style>

  const bx = view.x + (n.x + off.x) * view.s, by = view.y + (n.y + off.y) * view.s;
  if (collapsed.has(n.id)) { collapsed.delete(n.id); n.kids.forEach(k => born.add(k.id)); } else collapsed.add(n.id);
  render();
  view.x = bx - (n.x + off.x) * view.s; view.y = by - (n.y + off.y) * view.s; apply();
}
function select(n) { sel = n; nodesEl.querySelectorAll('.node.sel').forEach(e => e.classList.remove('sel')); n.el && n.el.classList.add('sel'); }

/* ---------- 交互 ---------- */
(function bind() {
  const pts = new Map(); let moved = false, start = null, pinch = null;
  stage.addEventListener('pointerdown', e => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; if (pts.size === 1) start = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s }; } });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; zoomAt(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d / view.s, (a.x + b.x) / 2, (a.y + b.y) / 2); moved = true; return; }
    if (!start) return; const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!moved && Math.hypot(dx, dy) < 5) return;
    if (!moved) { try { stage.setPointerCapture(e.pointerId); } catch (_) {} }
    moved = true; stage.classList.add('drag'); view.x = start.vx + dx; view.y = start.vy + dy; apply();
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { start = null; stage.classList.remove('drag'); } };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  stage.addEventListener('click', e => { if (moved) { moved = false; return; } const el = e.target.closest('.node'); if (!el) return; const n = ALL.find(x => x.id === +el.dataset.id); select(n); if (n.kids.length) toggle(n); });
  stage.addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const el = e.target.closest('.node'); if (!el) return; e.preventDefault(); const n = ALL.find(x => x.id === +el.dataset.id); select(n); if (n.kids.length) toggle(n); });
  stage.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey || (Math.abs(e.deltaY) >= 40 && Math.abs(e.deltaY) > Math.abs(e.deltaX) && e.deltaMode === 0 && !e.shiftKey)) zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), e.clientX, e.clientY); else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); } }, { passive: false });
  document.getElementById('cAll').onclick = () => { collapsed.clear(); render(); fit(true); };
  document.getElementById('cTwo').onclick = () => { setOpen(S.openDepth); render(); fit(true); };
  document.getElementById('cFit').onclick = () => fit(true);
  const cz = f => { world.classList.add('anim'); zoomAt(f, innerWidth / 2, innerHeight / 2); };
  document.getElementById('cIn').onclick = () => cz(1.2);
  document.getElementById('cOut').onclick = () => cz(1 / 1.2);
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => fit(false), 150); });
})();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { render(); fit(false); });
