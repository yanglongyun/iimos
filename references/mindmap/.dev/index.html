<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思维导图 · 交互原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #EEF1F4; --grid: #DCE2E8; --panel: #FFFFFF; --sunk: #F5F7F9; --ink: #15202B; --muted: #5A6674; --faint: #8A95A2; --rule: #D3DAE2;
  --root: #15202B; --root-ink: #FFFFFF; --accent: #4B47D6; --accent-ink: #FFFFFF; --ai: #7A4FD6;
  --c-chatgpt: #0E8468; --c-codex: #5146C8; --c-plugins: #B06F0C; --c-api: #BE3653; --c-ent: #2A70A4; --c-gen: #4B47D6;
  --shadow: 0 1px 2px rgba(21,32,43,.06), 0 4px 14px rgba(21,32,43,.07);
  --shadow-lg: 0 10px 40px rgba(21,32,43,.14);
  --f-sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F151B; --grid: #1A232C; --panel: #161F28; --sunk: #121A22; --ink: #E6ECF2; --muted: #93A1B0; --faint: #6B7887; --rule: #2A3642;
    --root: #E6ECF2; --root-ink: #0F151B; --accent: #8E8AFF; --accent-ink: #0F151B; --ai: #B595FF;
    --c-chatgpt: #3CC99E; --c-codex: #9189FF; --c-plugins: #E6A544; --c-api: #F2738C; --c-ent: #62ABE2; --c-gen: #8E8AFF;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --shadow-lg: 0 10px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; }
#app { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
code { font-family: var(--f-mono); font-size: .9em; background: color-mix(in srgb, var(--muted) 14%, transparent); padding: 0 4px; border-radius: 4px; }

/* ---------- 顶栏 ---------- */
.top { height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--rule); position: relative; z-index: 5; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap; }
.logo svg { flex: none; }
.tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; }
.top .crumb { min-width: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); }
.top .crumb b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 6px 11px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--panel); }

/* ---------- 首页 ---------- */
.home { height: calc(100% - 54px); overflow-y: auto; }
.home-in { max-width: 1080px; margin: 0 auto; padding: 56px 20px 64px; display: flex; flex-direction: column; gap: 44px; }
.hero { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
.hero h1 { margin: 0; font-size: clamp(28px, 4.4vw, 44px); line-height: 1.15; letter-spacing: -.02em; text-wrap: balance; max-width: 16em; }
.hero p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; max-width: 40em; }
.composer { width: 100%; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; font-size: 16px; line-height: 1.6; min-height: 54px; }
.composer .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--muted); }
.chip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.chip:hover { border-color: var(--muted); }
.depth { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.depth select { border: 1px solid var(--rule); border-radius: 7px; background: var(--panel); padding: 3px 6px; font: inherit; color: var(--ink); }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples button { border: 1px dashed var(--rule); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); text-align: left; }
.examples button:hover { border-color: var(--accent); color: var(--accent); }
.sec-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.sec-h h2 { margin: 0; font-size: 18px; }
.sec-h span { color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card:hover { border-color: var(--muted); box-shadow: var(--shadow); }
.card h3 { margin: 0; font-size: 16px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; gap: 10px; font-size: 12px; color: var(--faint); font-family: var(--f-mono); flex-wrap: wrap; }
.mini { height: 92px; border-radius: 8px; background: var(--sunk); overflow: hidden; }
.mini svg { width: 100%; height: 100%; display: block; }
.empty-note { color: var(--muted); font-size: 13px; padding: 18px; border: 1px dashed var(--rule); border-radius: 12px; }

/* ---------- 生成中 ---------- */
.gen { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 50; padding: 16px; }
.gen-box { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.gen-box h3 { margin: 0; font-size: 16px; }
.gen-box .src { font-family: var(--f-mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.bar { height: 4px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
.gen-box .now { font-size: 13px; color: var(--muted); }

/* ---------- 导图页 ---------- */
.mapview { height: calc(100% - 54px); display: flex; }
.stage { position: relative; flex: 1; min-width: 0; overflow: hidden; cursor: grab; touch-action: none; background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world.anim { transition: transform .3s ease; }
.world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.zoombar { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; }
.zoombar .btn { box-shadow: var(--shadow); }
.notice { position: absolute; left: 14px; top: 14px; right: 14px; max-width: 560px; background: color-mix(in srgb, var(--accent) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule)); border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.55; }

.node { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none; text-align: left; line-height: 1.4; white-space: nowrap; user-select: none; }
.node .en { display: block; font-size: 11px; color: var(--muted); font-family: var(--f-mono); font-weight: 400; }
.node .tog { flex: none; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; font-size: 11px; font-family: var(--f-mono); display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--bc); color: var(--bc); background: var(--panel); }
.node.open > .tog { background: var(--bc); color: var(--panel); }
.n0 { background: var(--root); color: var(--root-ink); padding: 12px 16px; border-radius: 12px; font-size: 18px; font-weight: 700; }
.n0 .en { color: color-mix(in srgb, var(--root-ink) 65%, transparent); font-size: 12px; }
.n0 .tog { border-color: var(--root-ink); color: var(--root-ink); background: transparent; }
.n0.open > .tog { background: var(--root-ink); color: var(--root); }
.n1 { background: var(--bc); color: #fff; padding: 9px 13px; border-radius: 10px; font-size: 15px; font-weight: 600; box-shadow: var(--shadow); }
@media (prefers-color-scheme: dark) { .n1 { color: #0F151B; } }
.n1 .en { color: inherit; opacity: .78; }
.n1 .tog { border-color: currentColor; color: inherit; background: transparent; }
.n1.open > .tog { background: var(--panel); color: var(--bc); border-color: var(--panel); }
.n2 { background: color-mix(in srgb, var(--bc) 9%, var(--panel)); border-color: color-mix(in srgb, var(--bc) 45%, var(--rule)); padding: 7px 11px; border-radius: 9px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
.n3 { padding: 4px 8px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--bc); background: var(--panel); border-color: color-mix(in srgb, var(--bc) 30%, var(--rule)); }
.n4, .n5, .n6 { padding: 3px 8px; border-radius: 6px; font-size: 13px; color: var(--ink); white-space: normal; max-width: 330px; background: color-mix(in srgb, var(--panel) 75%, transparent); }
.node.ai { border: 1px dashed color-mix(in srgb, var(--ai) 60%, transparent); background: color-mix(in srgb, var(--ai) 7%, var(--panel)); }
.node.ai .lab::before { content: "AI"; font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; color: var(--ai); border: 1px solid color-mix(in srgb, var(--ai) 50%, transparent); border-radius: 4px; padding: 0 3px; margin-right: 6px; vertical-align: 1px; }
.node.sel { outline: 2px solid var(--bc); outline-offset: 2px; }
.n0.sel { outline-color: var(--ink); }
.node.hit { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ai) 35%, transparent); }
.node.born { animation: born .45s ease; }
@keyframes born { from { opacity: 0; transform: var(--tf) translateX(-10px); } }
@media (prefers-reduced-motion: reduce) { .node.born { animation: none; } .world.anim { transition: none; } }

/* 节点浮动操作条 */
.actions { position: absolute; z-index: 4; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow-lg); padding: 3px; }
.actions button { border: 0; background: transparent; border-radius: 6px; padding: 5px 9px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.actions button:hover { background: var(--sunk); }
.actions button svg { color: var(--ai); }
.actions .sep { width: 1px; background: var(--rule); margin: 4px 2px; }

/* 大纲视图 */
.outline { flex: 1; min-width: 0; overflow-y: auto; background: var(--panel); }
.outline-in { max-width: 820px; margin: 0 auto; padding: 32px 24px 64px; }
.outline h1 { font-size: 26px; margin: 0 0 6px; }
.outline .lead { color: var(--muted); line-height: 1.75; margin: 0 0 22px; }
.outline h2 { font-size: 19px; margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--bc); }
.outline h3 { font-size: 16px; margin: 20px 0 6px; }
.outline h3 + p { margin: 0 0 8px; color: var(--muted); line-height: 1.7; }
.outline h4 { font-size: 13.5px; margin: 12px 0 4px; color: var(--bc); }
.outline ul { margin: 0; padding-left: 20px; line-height: 1.7; }
.outline li::marker { color: var(--bc); }
.outline .seo { font-size: 12px; color: var(--faint); font-family: var(--f-mono); margin-bottom: 18px; }

/* ---------- 侧栏 ---------- */
.side { width: 420px; flex: none; background: var(--panel); border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--rule); padding: 0 8px; flex: none; }
.tabs button { border: 0; background: none; padding: 12px 12px 10px; font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .x { margin-left: auto; font-weight: 400; display: none; }
.pane { flex: 1; min-height: 0; overflow-y: auto; }
.detail { padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.crumbs { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.detail h2 { margin: 0; font-size: 20px; line-height: 1.35; text-wrap: balance; }
.detail .en { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: 4px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; color: var(--bc); border: 1px solid color-mix(in srgb, var(--bc) 50%, transparent); border-radius: 999px; padding: 2px 9px; }
.sum { margin: 0; font-size: 14px; line-height: 1.75; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.detail section h3 { margin: 0 0 6px; font-size: 13px; color: var(--bc); }
.detail ul { margin: 0; padding-left: 18px; line-height: 1.65; }
.detail li::marker { color: var(--bc); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-size: 12.5px; text-decoration: none; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 9px; }
.links a:hover { border-color: var(--bc); color: var(--bc); }
.jump { display: block; width: 100%; text-align: left; border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; padding: 10px 12px; }
.jump:hover { border-color: var(--bc); }
.jump b { display: block; font-size: 14px; }
.jump span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 3px; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.aibox { border: 1px solid color-mix(in srgb, var(--ai) 35%, var(--rule)); background: color-mix(in srgb, var(--ai) 5%, var(--panel)); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.aibox .hd { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ai); }
.aibox .hd .grow { flex: 1; }
.aibox .hd button { border: 0; background: none; font-size: 12px; color: var(--muted); font-weight: 400; padding: 2px 4px; }
.aibox .hd button:hover { color: var(--ink); }
.aibtns { display: flex; gap: 8px; flex-wrap: wrap; }
.aibtns .btn { display: inline-flex; align-items: center; gap: 6px; }
.aibtns .btn svg { color: var(--ai); }
.md { font-size: 14px; line-height: 1.75; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; }
.md li { margin: 2px 0; }
.md strong { font-weight: 600; }
.md h4 { margin: 10px 0 4px; font-size: 13.5px; }
.caret::after { content: ""; display: inline-block; width: 7px; height: 14px; background: var(--ai); margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 对话 */
.chat { display: flex; flex-direction: column; height: 100%; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 100%; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--panel); padding: 8px 12px; border-radius: 12px 12px 4px 12px; max-width: 88%; line-height: 1.6; }
.msg.me .ctx { display: block; font-size: 11.5px; opacity: .7; margin-bottom: 2px; }
.msg.bot { align-self: stretch; }
.msg.bot .who { font-size: 11.5px; font-weight: 600; color: var(--ai); margin-bottom: 4px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ref { border: 1px solid color-mix(in srgb, var(--bc) 45%, var(--rule)); background: color-mix(in srgb, var(--bc) 7%, var(--panel)); color: var(--ink); border-radius: 7px; padding: 3px 8px; font-size: 12.5px; text-align: left; }
.ref:hover { border-color: var(--bc); }
.done-act { font-size: 12px; color: var(--muted); margin-top: 6px; }
.chat-foot { border-top: 1px solid var(--rule); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: none; }
.sugg { display: flex; gap: 6px; flex-wrap: wrap; }
.sugg button { border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.sugg button:hover { color: var(--ink); border-color: var(--muted); }
.ctxbar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.ctxbar span { border: 1px solid var(--rule); border-radius: 6px; padding: 2px 7px; color: var(--ink); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctxbar button { border: 0; background: none; color: var(--muted); padding: 0 2px; }
.inrow { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--rule); border-radius: 12px; padding: 6px 6px 6px 12px; background: var(--panel); }
.inrow:focus-within { border-color: var(--accent); }
.inrow textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; line-height: 1.5; max-height: 120px; padding: 4px 0; }
.send { flex: none; width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.send:disabled { opacity: .4; cursor: default; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; box-shadow: var(--shadow-lg); }

@media (max-width: 860px) {
  .top .crumb, .top .hide-s { display: none; }
  .mapview { flex-direction: column; }
  .side { width: 100%; height: 52%; border-left: 0; border-top: 1px solid var(--rule); }
  .side.min { height: auto; }
  .side.min .pane { display: none; }
  .tabs .x { display: block; }
  .home-in { padding-top: 32px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const L = (t, u) => [t, u];
const LC = 'https://learn.chatgpt.com';
const DATA = {
  t: 'DevDay 2026', en: 'OpenAI · 2026-09-29',
  sum: '本次 DevDay 共发布 17 项更新，分为五条主线：ChatGPT 本体（常驻智能体 dots、Work 跨设备、Space 协作）、Codex（Ultrafast、云端环境、安全扫描）、插件与站点（开放给开发者的接入能力）、API（新模型 GPT-6.1 Sol 与 Ultrafast），以及企业版（Slack/Teams、团队任务、共享连接、安全策略）。',
  kids: [
  { t: 'ChatGPT', en: '面向个人用户的产品', key: 'chatgpt',
    sum: '面向终端用户的三项更新：可以长期托管工作的个人智能体 dots、可在多设备间续接的 Work 任务，以及由 Library 升级而来的协作空间 Space。',
    kids: [
    { t: 'Dots 常驻智能体', en: 'Meet your dot',
      sum: '常驻运行的个人智能体。为它设定目标与可自主执行的范围后，它会在自己的云端电脑上跨已连接应用持续推进工作，对话结束后也不会停止，完成后带回结果供你审阅，需要你判断时会主动联系你。目前向符合条件的账号逐步开放。',
      links: [L('Dots 使用指南', LC+'/docs/dots'), L('可用范围', LC+'/docs/dots#access'), L('管理员指南', LC+'/docs/enterprise/o-admin-guide')],

}

function md(src) {

  for (const ln of lines) {

    if ((mm = ln.match(/^- (.*)/))) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += `<li>${inline(mm[1])}</li>`; }
    else if ((mm = ln.match(/^\d+\. (.*)/))) { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += `<li>${inline(mm[1])}</li>`; }

  }
  close(); return h;
}

  const box = app.querySelector('#aiOut');
  if (!box) return;
  if (M.explain[n.id] && !force) { box.innerHTML = md(M.explain[n.id]); return; }
  const text = explainText(M, n);
  app.querySelector('#aiBox').hidden = false;
  app.querySelector('#aiBtns').hidden = true;
  const ok = await streamInto(box, text);
  if (ok) { M.explain[n.id] = text; const rb = app.querySelector('#aiRe'); rb && (rb.hidden = false); }
}
let expanding = false;
async function expand(n) {
  if (expanding) return;
  if (n.kids.length && M.collapsed.has(n.id)) { select(n); toggle(n); return; }
  if (n.kids.some(k => k.ai)) { toast('该节点已由 AI 展开'); return; }
  expanding = true;
  const items = expandItems(n);
  select(n, true);
  if (n.el) n.el.classList.add('hit');
  toast('AI 正在展开「' + plain(n.t).slice(0, 18) + (n.t.length > 18 ? '…' : '') + '」');
  await sleep(700);
  M.collapsed.delete(n.id);
  for (const t of items) {
    const k = { id: ++UID, t, key: n.key, depth: n.depth + 1, parent: n, kids: [], ai: true };
    n.kids.push(k); born.add(k.id);
    const bx = view.x + n.x * view.s, by = view.y + n.y * view.s;
    render(); view.x = bx - n.x * view.s; view.y = by - n.y * view.s; apply();
    await sleep(160);
  }
  reveal(n, true);
  renderDetail();
  expanding = false;
}

/* ---------- 详情栏 ---------- */
function renderDetail() {
  const pane = app.querySelector('#paneNode'); if (!pane) return;
  const n = sel, bc = n.depth === 0 ? 'var(--ink)' : colorOf(n);
  pane.style.setProperty('--bc', bc);
  const crumbs = pathOf(n).slice(0, -1).map(p => `<button type="button" data-go="${p.id}">${esc(plain(p.t))}</button><span>›</span>`).join('');
  const c = catOf(n), f = featureOf(n);
  let h = `<div class="detail">`;
  if (crumbs) h += `<div class="crumbs">${crumbs}</div>`;
  h += `<div>${c && n.depth > 1 ? `<span class="pill">${esc(c.t)}</span>` : ''}<h2 style="margin-top:${c && n.depth > 1 ? 8 : 0}px">${n.depth >= 4 ? fmt(n.t) : esc(n.t)}</h2>${n.en ? `<div class="en">${esc(n.en)}</div>` : ''}</div>`;
  const cached = M.explain[n.id];
  h += `<div class="aibox" style="--bc:var(--ai)">
    <div class="hd">${I.spark}<span>AI 解释</span><span class="grow"></span><button type="button" id="aiRe"${cached ? '' : ' hidden'}>重新生成</button></div>
    <div class="aibtns" id="aiBtns"${cached ? ' hidden' : ''}>
      <button class="btn" type="button" data-a2="explain">${I.spark}解释这个节点</button>
      <button class="btn" type="button" data-a2="expand">${I.branch}${n.kids.length && M.collapsed.has(n.id) ? '展开子节点' : 'AI 展开下一层'}</button>
      <button class="btn" type="button" data-a2="ask">${I.ask}就此提问</button>
    </div>
    <div id="aiBox"${cached ? '' : ' hidden'}><div class="md" id="aiOut">${cached ? md(cached) : ''}</div></div>
  </div>`;
  if (n.depth <= 1 && n.kids.length) {
    if (n.sum) h += `<p class="sum">${esc(n.sum)}</p>`;
    const groups = n.depth === 0 ? n.kids : [n];
    groups.forEach(g => {
      if (n.depth === 0) h += `<div class="label" style="color:${colorOf(g)}">${esc(g.t)}</div>`;
      h += `<div class="stack">` + g.kids.map(k => `<button class="jump" type="button" data-go="${k.id}" style="--bc:${colorOf(k)}"><b>${esc(k.t)}</b>${k.sum ? `<span>${esc(k.sum)}</span>` : ''}</button>`).join('') + `</div>`;
    });
  } else if (f) {
    if (n.depth === 2 && f.sum) h += `<div><div class="label">官方概述</div><p class="sum">${esc(f.sum || '')}</p></div>`;
    const groups = n.depth === 2 ? n.kids.filter(k => k.kids.length || !k.ai) : n.kids.length ? [n] : n.parent && n.parent.depth >= 2 ? [n.parent] : [];
    groups.forEach(g => {
      if (!g.kids.length) return;
      h += `<section><h3>${esc(plain(g.t))}</h3><ul>` + g.kids.map(l => `<li${l === n ? ' style="font-weight:600"' : ''}>${l.ai ? '<span style="color:var(--ai);font-size:11px;font-family:var(--f-mono)">AI </span>' : ''}${fmt(l.t)}</li>`).join('') + `</ul></section>`;
    });
    if (n.depth > 2) h += `<button class="jump" type="button" data-go="${f.id}"><b>查看「${esc(f.t)}」全部内容</b></button>`;
    if (f.links) h += `<div><div class="label">来源文档</div><div class="links">` + f.links.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join('') + `</div></div>`;
  } else if (n.kids.length) {
    h += `<section><h3>子节点</h3><ul>` + n.kids.map(k => `<li>${fmt(k.t)}</li>`).join('') + `</ul></section>`;
  }
  if (n.depth === 0 && M.source) h += `<div><div class="label">来源</div><div class="links"><a href="https://${M.source}" target="_blank" rel="noopener">${esc(M.source)} ↗</a></div><p class="sum" style="color:var(--muted);font-size:12.5px;margin-top:8px">共读取 ${M.pages} 篇文档 · 发布日期 ${M.date}</p></div>`;
  h += `</div>`;
  pane.innerHTML = h;
  pane.scrollTop = 0;
  pane.querySelectorAll('[data-go]').forEach(b => b.onclick = () => focusNode(findId(+b.dataset.go)));
  pane.querySelectorAll('[data-a2]').forEach(b => b.onclick = () => act(b.dataset.a2, sel));
  const re = pane.querySelector('#aiRe'); if (re) re.onclick = () => { delete M.explain[sel.id]; explain(sel, true); };
}

/* ---------- 对话 ---------- */
const SUGG = { dev: ['Plus 用户能用哪些新功能？', '这次发布涉及哪些价格变化？', '企业管理员需要做什么？', '展开插件与站点'], gen: ['这个主题的核心要点是什么？', '有哪些容易误解的地方？'] };
function renderChat() {
  const pane = app.querySelector('#paneChat');
  pane.innerHTML = `<div class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="chat-foot">
      <div class="sugg" id="sugg">${(M.generated ? SUGG.gen : SUGG.dev).map(s => `<button type="button">${esc(s)}</button>`).join('')}</div>
      <div class="ctxbar" id="ctxbar" hidden></div>
      <form class="inrow" id="chatForm"><textarea id="chatIn" rows="1" placeholder="针对整张导图提问，或在节点上点「提问」"></textarea><button class="send" type="submit" aria-label="发送">${I.send}</button></form>
    </div></div>`;
  const msgs = pane.querySelector('#msgs');
  if (!M.chat.length) M.chat.push({ role: 'bot', text: M.generated ? `你好。这张导图是「${M.title}」的结构示意，可以针对它提问。` : `你好。我已读取这张导图及其 ${M.pages} 篇来源文档，可以回答关于 **${M.title}** 的任何问题，也可以按你的要求展开或收起分支。`, refs: [] });
  M.chat.forEach(m => msgs.appendChild(msgEl(m)));
  const form = pane.querySelector('#chatForm'), ta = pane.querySelector('#chatIn');
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  form.onsubmit = e => { e.preventDefault(); const v = ta.value.trim(); if (!v) return; ta.value = ''; ta.style.height = 'auto'; ask(v); };
  pane.querySelector('#sugg').querySelectorAll('button').forEach(b => b.onclick = () => ask(b.textContent));
  renderCtx();
}
function renderCtx() {
  const bar = app.querySelector('#ctxbar'); if (!bar) return;
  if (!ctxNode) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = `关于节点<span>${esc(plain(ctxNode.t))}</span><button type="button" aria-label="移除节点上下文">×</button>`;
  bar.querySelector('button').onclick = () => { ctxNode = null; renderCtx(); };
  const ta = app.querySelector('#chatIn'); ta.placeholder = '请输入关于这个节点的问题，直接发送将获得解释'; ta.focus();
}
function msgEl(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + m.role;
  if (m.role === 'me') d.innerHTML = (m.ctx ? `<span class="ctx">关于「${esc(plain(m.ctx).slice(0, 24))}」</span>` : '') + esc(m.text);
  else {
    d.innerHTML = `<div class="who">AI</div><div class="md">${md(m.text)}</div>`;
    if (m.refs && m.refs.length) d.appendChild(refsEl(m.refs));
    if (m.done) d.insertAdjacentHTML('beforeend', `<div class="done-act">${esc(m.done)}</div>`);
  }
  return d;
}
function refsEl(refs) {
  const w = document.createElement('div'); w.className = 'refs';
  refs.forEach(n => { const b = document.createElement('button'); b.type = 'button'; b.className = 'ref'; b.style.setProperty('--bc', colorOf(n)); b.textContent = plain(n.t).slice(0, 26) + (n.t.length > 26 ? '…' : ''); b.onclick = () => focusNode(n); w.appendChild(b); });
  return w;
}
let chatting = false;
async function ask(q) {
  if (chatting) return;
  chatting = true;
  setTab('chat');
  const msgs = app.querySelector('#msgs');
  const ctx = ctxNode; ctxNode = null; renderCtx();
  const me = { role: 'me', text: q, ctx: ctx ? ctx.t : null };
  M.chat.push(me); msgs.appendChild(msgEl(me));
  const r = reply(M, q, ctx);
  const d = document.createElement('div'); d.className = 'msg bot';
  d.innerHTML = `<div class="who">AI</div><div class="md"></div>`;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  await streamInto(d.querySelector('.md'), r.text, () => { msgs.scrollTop = msgs.scrollHeight; });
  const rec = { role: 'bot', text: r.text, refs: r.refs };
  if (r.refs.length) d.appendChild(refsEl(r.refs));
  if (r.act) {
    if (r.act.type === 'expandAll') { walk(r.act.node, n => M.collapsed.delete(n.id)); pathOf(r.act.node).forEach(p => M.collapsed.delete(p.id)); }
    else M.collapsed.add(r.act.node.id);
    if (mode !== 'canvas') setMode('canvas');
    render(); select(r.act.node, true); reveal(r.act.node, true);
    rec.done = '已在导图中执行';
    d.insertAdjacentHTML('beforeend', `<div class="done-act">已在导图中执行</div>`);
  }
  M.chat.push(rec);
  msgs.scrollTop = msgs.scrollHeight;
  chatting = false;
}

/* ---------- 大纲视图（对应正式版中服务端渲染、可被搜索引擎收录的页面） ---------- */
function renderOutline(el) {
  const r = M.root;
  const li = n => `<li>${n.ai ? '<span style="color:var(--ai);font-size:11px;font-family:var(--f-mono)">AI </span>' : ''}${fmt(n.t)}${n.kids.length ? `<ul>${n.kids.map(li).join('')}</ul>` : ''}</li>`;
  let h = `<div class="outline-in"><div class="seo">/map/${esc(M.id)} · 公开页面</div><h1>${esc(M.title)}</h1><p class="lead">${esc(M.desc || '')}</p>`;
  r.kids.forEach(c => {
    h += `<h2 style="--bc:${colorOf(c)}">${esc(c.t)}</h2>`;
    c.kids.forEach(f => {
      h += `<div style="--bc:${colorOf(f)}"><h3>${esc(f.t)}${f.en ? ` <span style="font-weight:400;color:var(--muted);font-size:13px">${esc(f.en)}</span>` : ''}</h3>${f.sum ? `<p>${esc(f.sum)}</p>` : ''}`;
      f.kids.forEach(a => { if (a.kids.length) h += `<h4>${esc(a.t)}</h4><ul>${a.kids.map(li).join('')}</ul>`; else h += `<ul>${li(a)}</ul>`; });
      h += `</div>`;
    });
  });
  h += `</div>`;
  el.innerHTML = h;
  el.style.setProperty('--bc', 'var(--ink)');
}

/* ================= 启动 ================= */
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(route);
</script>
