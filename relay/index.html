<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <title>iimos</title>
  <style>
    :root { --bg: #050505; --ink: #ddd; --dim: #777; --acc: #7cff9b; --bad: #ff6b6b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); display: none; }
    /* 放在底部正中、很小:不压住你的界面顶栏(那里是它自己的按钮)。连上之后只剩一个点和菜单 */
    #status { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0) + 2px); left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 6px; align-items: center; padding: 2px 6px; font-size: 11px; color: var(--dim); background: rgba(5,5,5,.7); border-radius: 10px; }
    #status.on { opacity: .55; }
    #status.on #statusText { display: none; }
    #status i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
    #status.on i { background: var(--acc); box-shadow: 0 0 6px var(--acc); }
    #status.off i { background: var(--bad); }
    #menu { background: none; border: 0; color: var(--dim); font-size: 12px; padding: 0 4px; }
    #sheet { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0) + 30px); left: 50%; transform: translateX(-50%); z-index: 6; background: #111; border: 1px solid #333; border-radius: 10px; padding: 6px; display: none; min-width: 180px; }
    #sheet button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 8px 10px; font: inherit; border-radius: 6px; }
    #sheet button:active { background: #222; }
    #note { max-width: 520px; margin: 18vh auto 0; padding: 0 22px; }
    #note h2 { font-weight: 600; }
    #note code { color: var(--acc); }
  </style>
</head>
<body>
  <div id="note"><h2>iimos</h2><p id="noteText">正在连接你的 iimos…</p></div>
  <iframe id="app" title="iimos"></iframe>
  <div id="status"><i></i><span id="statusText">连接中</span><button id="menu" aria-label="菜单">⋯</button></div>
  <div id="sheet">
    <button id="openApp">回到界面</button>
    <button id="openRecovery">救援页</button>
    <button id="enablePush">开启通知</button>
    <button id="forget">在这台设备上忘掉它</button>
  </div>
  <script type="module" src="/shell.js"></script>
</body>
</html>
